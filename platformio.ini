; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:JC3248W535EN]
; pioarduino's platform with ESP-IDF 6.1 (and its GCC 15 toolchain, CMake 4)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = JC3248W535EN
; Plain ESP-IDF (CMake + FreeRTOS). Configuration: sdkconfig.defaults; ESP-IDF components
; (esp-nimble-cpp, esp_new_jpeg) come from src/idf_component.yml. Compiler flags: the
; CMakeLists.txt files.
framework = espidf
board_build.partitions = partitions.csv
; Build with ESP-IDF's own build system (CMake + Ninja), not PlatformIO's - see the script.
extra_scripts = pre:scripts/idf_build.py

; PlatformIO downloads these into .pio/libdeps/; ESP-IDF's build compiles them as the components in
; components/.
lib_deps =
    https://github.com/lvgl/lvgl.git#release/v8.3
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.6.1
    bitbank2/PNGdec@^1.0.3
monitor_speed = 115200
; The 6.x platform dropped the esp32_exception_decoder monitor filter; decode panic backtraces with
; the "ESP Decoder" VS Code extension (Jason2866.esp-decoder) or the flash core dump (esp-coredump).
