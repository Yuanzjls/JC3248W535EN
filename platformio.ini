; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:JC3248W535EN]
platform = espressif32
board = JC3248W535EN
; Plain ESP-IDF (CMake + FreeRTOS). Configuration: sdkconfig.defaults; ESP-IDF components
; (esp-nimble-cpp, esp_new_jpeg) come from src/idf_component.yml.
framework = espidf
board_build.partitions = partitions.csv
extra_scripts =
    pre:scripts/add_lv_conf_include.py
    ; version string (git describe) stays current - see the script
    pre:scripts/refresh_version.py
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    ; PNGdec's default line buffer caps PNG width at ~640 px (RGBA). Allow up to 4096 px wide;
    ; the decoder object lives in PSRAM (media_ui.cpp), so the bigger buffer is cheap.
    -DPNG_MAX_BUFFERED_PIXELS=32770
    ; PNGdec.h takes its plain-C (non-Arduino) branch only for macOS/Linux/MCUXpresso, not for
    ; ESP_PLATFORM like JPEGDEC does; this selects it. (JPEGDEC then also compiles a few unused
    ; stdio helpers.) Nothing else checks this macro.
    -D__MCUXPRESSO
    ; The SD card doesn't answer ESP-IDF's SD Status Register read in SPI mode; let init continue
    ; without it (see __wrap_sdmmc_init_sd_ssr in src/sd_card.cpp).
    -Wl,--wrap=sdmmc_init_sd_ssr
; ESP-IDF version: the framework-espidf package of the installed espressif32 platform (5.5.x).

lib_deps =
    https://github.com/lvgl/lvgl.git#release/v8.3
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.6.1
    bitbank2/PNGdec@^1.0.3
; JPEGDEC / PNGdec only ship an Arduino library.properties, so PlatformIO would treat them as
; Arduino-only and skip them; both build fine on plain ESP-IDF (ESP_PLATFORM branch).
lib_compat_mode = off
; JPEGDEC's declared dependency (a display library) is not used here.
lib_ignore = bb_spi_lcd
monitor_speed = 115200
; Decode panic backtraces to file:line in `pio device monitor`
monitor_filters = esp32_exception_decoder
