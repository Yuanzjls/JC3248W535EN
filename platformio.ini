; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:JC3248W535EN]
platform = espressif32
board = JC3248W535EN
framework = arduino
extra_scripts = pre:scripts/add_lv_conf_include.py
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    ; ESP32-S3: route Arduino Serial to USB CDC so logs appear on the USB port (not only UART0)
    -DARDUINO_USB_CDC_ON_BOOT=1
; Use platform-bundled framework + libs (3.3.7 release pair). Do not pin libs to idf-release/v5.1
; alone — it mismatches the core and breaks HAL/soc headers.

lib_extra_dirs = 
    libraries

lib_deps = 
    https://github.com/lvgl/lvgl.git#release/v8.3
monitor_speed = 115200
