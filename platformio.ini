; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:JC3248W535EN]
platform = espressif32
board = JC3248W535EN
framework = arduino
extra_scripts = pre:scripts/add_lv_conf_include.py
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    ; ESP32-S3: route Arduino Serial to USB CDC so logs appear on the USB port (not only UART0)
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; PNGdec's default line buffer caps PNG width at ~640 px (RGBA). Allow up to 4096 px wide;
    ; the decoder object lives in PSRAM (media_ui.cpp), so the bigger buffer is cheap.
    -DPNG_MAX_BUFFERED_PIXELS=32770
; Use platform-bundled framework + libs (3.3.7 release pair). Do not pin libs to idf-release/v5.1
; alone — it mismatches the core and breaks HAL/soc headers.

lib_extra_dirs = 
    libraries

lib_deps = 
    https://github.com/lvgl/lvgl.git#release/v8.3
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.6.1
    bitbank2/PNGdec@^1.0.3
monitor_speed = 115200
; Decode panic backtraces to file:line in `pio device monitor`
monitor_filters = esp32_exception_decoder
