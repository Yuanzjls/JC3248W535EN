; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:JC3248W535EN]
platform = espressif32
board = JC3248W535EN
; ESP-IDF (CMake + FreeRTOS) with Arduino-ESP32 as a component: the configuration comes from
; sdkconfig.defaults (start: identical to Arduino's prebuilt config, qio_opi variant) instead of
; Arduino's prebuilt libraries. First step of moving to plain ESP-IDF.
framework = arduino, espidf
board_build.partitions = partitions.csv
; PlatformIO compiles ESP-IDF sources itself and doesn't run CMake's file-embedding step, so files
; that components embed (target_add_binary_data / EMBED_TXTFILES) must be listed here too. These
; are pulled in by the Arduino component (Insights / RainMaker), unused by this app.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
extra_scripts = pre:scripts/add_lv_conf_include.py
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    ; PNGdec's default line buffer caps PNG width at ~640 px (RGBA). Allow up to 4096 px wide;
    ; the decoder object lives in PSRAM (media_ui.cpp), so the bigger buffer is cheap.
    -DPNG_MAX_BUFFERED_PIXELS=32770
    ; The SD card doesn't answer ESP-IDF's SD Status Register read in SPI mode; let init continue
    ; without it (see __wrap_sdmmc_init_sd_ssr in src/sd_card.cpp).
    -Wl,--wrap=sdmmc_init_sd_ssr
; Use platform-bundled framework + libs (3.3.7 release pair). Do not pin libs to idf-release/v5.1
; alone — it mismatches the core and breaks HAL/soc headers.

lib_extra_dirs = 
    libraries

lib_deps = 
    https://github.com/lvgl/lvgl.git#release/v8.3
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.6.1
    bitbank2/PNGdec@^1.0.3
monitor_speed = 115200
; Decode panic backtraces to file:line in `pio device monitor`
monitor_filters = esp32_exception_decoder
